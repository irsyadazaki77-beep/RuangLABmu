# ============================================================================
# Render.com Blueprint — 1-Click Cloud Deployment for RuangLABmu
# Documentation: https://render.com/docs/blueprint-spec
# ============================================================================
services:
  - type: web
    name: ruanglabmu
    env: docker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /readyz
    autoDeploy: true
    disk:
      name: ruanglabmu-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /app/data/ruanglabmu.db
      - key: RUANGLAB_DB_PATH
        value: /app/data/ruanglabmu.db
      - key: GEMINI_API_KEY
        sync: false
