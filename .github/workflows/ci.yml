name: RuangLABmu CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Typecheck, Unit Test & Build (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.x'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Lint (tsc --noEmit)
        run: npm run lint

      - name: Run Quantitative & Collab Engine Unit Tests
        run: npm test

      - name: Build Production Client & Server Bundles
        run: npm run build

  e2e-smoke:
    name: Playwright E2E Smoke Suite (Headless Chromium & WebSocket)
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.x'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Build Production Bundles
        run: npm run build

      - name: Run Playwright E2E Smoke Tests
        env:
          CI: 'true'
          APP_URL: 'http://localhost:3000'
          ALLOWED_ORIGINS: 'http://localhost:3000'
        run: npm run test:e2e

      - name: Upload Playwright Report & Traces on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
